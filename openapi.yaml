tags:
  - name: Video Generation
    description: |
      **Status**: ✅ Fully Implemented

      Image-to-video conversion endpoints.

      ## Python Example

      ```python
      import requests
      import base64
      import time

      API_BASE = "https://telegram-ai-bot-4esd.onrender.com/v1"
      API_TOKEN = "nvapi_live_YOUR_KEY"

      headers = {
          "Authorization": f"Bearer {API_TOKEN}",
          "Content-Type": "application/json"
      }

      def generate_video(image_path, template="all_take_off", quality="balanced"):
          with open(image_path, "rb") as f:
              image_base64 = base64.b64encode(f.read()).decode()

          # Create job
          response = requests.post(
              f"{API_BASE}/video/generate",
              headers=headers,
              json={
                  "image": image_base64,
                  "template": template,
                  "quality_preset": quality
              }
          )
          data = response.json()
          request_id = data["request_id"]
          print(f"Job created: {request_id}, credits charged: {data['credits_charged']}")

          # Poll until complete
          while True:
              status = requests.get(
                  f"{API_BASE}/video/{request_id}",
                  headers=headers
              ).json()

              print(f"Status: {status['status']}")

              if status["status"] == "completed":
                  # Save video
                  video_data = base64.b64decode(status["video"])
                  with open("output.mp4", "wb") as f:
                      f.write(video_data)
                  print("Video saved!")
                  break
              elif status["status"] == "failed":
                  print(f"Error: {status.get('error')}")
                  break

              time.sleep(10)

      # Usage
      generate_video("input.jpg", "tops_remove", "fast")
      ```

      ## cURL Example

      ```bash
      # Create job
      curl -X POST https://telegram-ai-bot-4esd.onrender.com/v1/video/generate \
        -H "Authorization: Bearer nvapi_live_YOUR_KEY" \
        -H "Content-Type: application/json" \
        -d '{
          "image": "'$(base64 -i input.jpg)'",
          "template": "tops_remove",
          "quality_preset": "fast"
        }'

      # Response: {"request_id": "req_xxx", "status": "processing", ...}

      # Check status
      curl https://telegram-ai-bot-4esd.onrender.com/v1/video/req_xxx \
        -H "Authorization: Bearer nvapi_live_YOUR_KEY"
      ```

      ## JavaScript/Node.js Example

      ```javascript
      const fs = require('fs');

      const API_BASE = 'https://telegram-ai-bot-4esd.onrender.com/v1';
      const API_TOKEN = 'nvapi_live_YOUR_KEY';

      async function generateVideo(imagePath, options = {}) {
        const imageBase64 = fs.readFileSync(imagePath).toString('base64');

        // Create job
        const response = await fetch(`${API_BASE}/video/generate`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${API_TOKEN}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            image: imageBase64,
            template: options.template || 'all_take_off',
            quality_preset: options.quality || 'balanced'
          })
        });

        const job = await response.json();
        console.log('Job created:', job.request_id);

        // Poll for result
        while (true) {
          const statusRes = await fetch(`${API_BASE}/video/${job.request_id}`, {
            headers: { 'Authorization': `Bearer ${API_TOKEN}` }
          });
          const status = await statusRes.json();

          if (status.status === 'completed') {
            const videoBuffer = Buffer.from(status.video, 'base64');
            fs.writeFileSync('output.mp4', videoBuffer);
            console.log('Video saved!');
            break;
          } else if (status.status === 'failed') {
            console.error('Error:', status.error);
            break;
          }

          await new Promise(r => setTimeout(r, 10000));
        }
      }

      generateVideo('input.jpg', { template: 'tops_remove', quality: 'fast' });
      ```

