info:
  title: NSFW Video API
  version: 1.4.0
  description: |
    # NSFW Video API

    AI-powered Image-to-Video conversion API for NSFW content.

    **Age Restriction**: This API is intended for **adults only (18+)**. By using this API, you confirm that you are of legal age in your jurisdiction.

    ---

    ## Implementation Status

    | Component | Status | Description |
    |-----------|--------|-------------|
    | Video Generation | ✅ Implemented | POST /v1/video/generate |
    | Video Status | ✅ Implemented | GET /v1/video/:requestId |
    | Authentication | ✅ Implemented | Bearer token (nvapi_live_xxx) |
    | Credit System | ✅ Implemented | Per-request billing |
    | Rate Limiting | ✅ Implemented | Tier-based limits |
    | Webhooks | 🚧 Planned | Async notifications |
    | Account API | 🚧 Planned | Usage tracking endpoints |
    | Crypto Payments | 🚧 Planned | Coinbase Commerce |

    ---

    ## Quick Start

    ```bash
    # 1. Get API key from admin (contact support@example.com)

    # 2. Test authentication
    curl https://telegram-ai-bot-4esd.onrender.com/v1/health

    # 3. Generate video
    curl -X POST https://telegram-ai-bot-4esd.onrender.com/v1/video/generate \
      -H "Authorization: Bearer nvapi_live_YOUR_KEY" \
      -H "Content-Type: application/json" \
      -d '{"image": "BASE64_IMAGE", "template": "tops_remove", "quality_preset": "fast"}'

    # 4. Poll for result
    curl https://telegram-ai-bot-4esd.onrender.com/v1/video/req_xxx \
      -H "Authorization: Bearer nvapi_live_YOUR_KEY"
    ```

    ---

    ## Output Specifications

    | Property | Value |
    |----------|-------|
    | Resolution | 832 x 480 (16:9) |
    | Frame Rate | 32 fps (after FILM VFI) |
    | Duration | ~5 seconds |
    | Codec | H.264 |
    | Container | MP4 |
    | Output | Base64 encoded |

    ---

    ## Quality Presets & Pricing

    | Preset | Steps | Credits | Est. Time | Use Case |
    |--------|-------|---------|-----------|----------|
    | `ultra_fast` | 2 | 25 | ~1 min | Quick preview |
    | `fast` | 4 | 35 | ~2 min | Drafts |
    | `balanced` | 8 | 50 | ~4 min | Production (default) |
    | `quality` | 12 | 75 | ~6 min | High quality |

    **Tier Discounts**: basic 20%, pro 40%, enterprise 60%

    ---

    ## Templates (21 available)

    Templates are DB-driven and may expand over time. The list below reflects currently available templates.

    | Template | Category | Description |
    |----------|----------|-------------|
    | `all_take_off` | Undress | Full undress (default) |
    | `tops_remove` | Undress | Top removal only |
    | `bottoms_remove` | Undress | Bottom removal only |
    | `smashcut` | Special | Scene-cut transition (use with timestamped prompt) |
    | `nipple_play` | Breast | Nipple play |
    | `massage_tits` | Breast | Breast massage |
    | `breast_rub` | Breast | Breast rubbing |
    | `nipple_suck` | Breast | Nipple sucking |
    | `paizuri` | Breast | Titfuck/Paizuri |
    | `cunnilingus` | Oral | Cunnilingus |
    | `blowjob` | Oral | Blowjob |
    | `french_kiss` | Oral | French kiss (3rd person) |
    | `analingus` | Oral | Analingus |
    | `handjob` | Position | Handjob |
    | `missionary` | Position | Missionary |
    | `doggy` | Position | Doggy style |
    | `cowgirl` | Position | Cowgirl |
    | `assertive_cowgirl` | Position | Assertive cowgirl |
    | `bottom_pov` | Position | Bottom POV angle |
    | `rub_pussy` | Solo | Pussy rubbing (solo or couple) |
    | `pov_kissing` | POV | POV kissing (1st person) |

    Override any template's default prompt with the custom `prompt` parameter.

    ## LoRA Parameters (v1.0.131)

    Fine-tune LoRA strengths at runtime without Docker rebuild:

    | Parameter | Type | Range | Default | Description |
    |-----------|------|-------|---------|-------------|
    | `rip_strength` | float | 0.0~1.5 | template config | Override rip-shura strength |
    | `action_strength` | float | 0.0~1.5 | template config | Override action LoRA strength |
    | `use_rip_shura` | bool | - | true | Enable/disable rip-shura |
    | `use_action_lora` | bool | - | true | Enable/disable action LoRA |

    ---

    ## Rate Limits

    | Tier | Per Minute | Per Day |
    |------|------------|---------|
    | free | 10 | 100 |
    | basic | 20 | 500 |
    | pro | 60 | 2000 |
    | enterprise | 200 | unlimited |

